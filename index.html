<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Attend-X: smart fingerprint attendance for schools, universities, factories and companies.">
</head>
<body>
<title>Attend-X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: navy brand world (the Attend-X identity's dark theme). Hero with the 3D product device, then a numbered flow, sectors, plans by sector, and a WhatsApp contact form. */
:root {
  color-scheme: dark;
  --navy: #122245;          /* brand-navy, logo ground */
  --navy-deep: #0E1B38;     /* surface-sunken */
  --panel: #1A2F5C;         /* surface */
  --line: #2C4577;
  --sky: #6EB4F9;           /* brand-sky: verification color */
  --sky-hover: #93C8FB;
  --blue: #709ADB;          /* brand-blue */
  --ink: #F4F7FC;
  --muted: #A9BADB;
  --on-sky: #0E1B38;
  --sky-soft: #24407A;
  --success: #4ADE80;
  --success-soft: #14532D;
  --amber: #F5A524;         /* device display digits */
  --screen: #0B1530;

  --f-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "Cairo", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;

  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-full: 999px;
  --wrap: 1160px;
}
html { scroll-behavior: smooth; scroll-padding-top: 76px; }  /* 76px = sticky header, so a linked section starts right under it */
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--navy); color: var(--ink); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
html[lang="ar"] body { font-family: var(--f-ar); line-height: 1.75; }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
a { color: var(--sky); }
img { display: block; }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: 20px; }
.display { font-family: var(--f-display); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
html[lang="ar"] .display { font-family: var(--f-ar); font-weight: 700; letter-spacing: 0; }
.eyebrow { font: 600 12px/1.4 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--sky); }
html[lang="ar"] .eyebrow { font-family: var(--f-ar); letter-spacing: 0; font-size: 14px; }
.section { padding-block: 88px; }
.section--deep { background: var(--navy-deep); }
.sec-head { display: grid; gap: 12px; max-width: 680px; margin-bottom: 44px; }
.sec-head h2 { font-size: clamp(30px, 4vw, 44px); line-height: 1.08; }
html[lang="ar"] .sec-head h2 { line-height: 1.35; }
.sec-head p { color: var(--muted); font-size: 17px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px/20px var(--f-body); padding: 13px 22px; border-radius: var(--r-md); border: 1px solid transparent; text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s; }
html[lang="ar"] .btn { font-family: var(--f-ar); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[hidden] { display: none; }
.btn--primary { background: var(--sky); color: var(--on-sky); }
.btn--primary:hover { background: var(--sky-hover); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn--ghost:hover { border-color: var(--sky); }
.btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(18,34,69,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top__in { display: flex; align-items: center; gap: 24px; min-height: 76px; }
.top__logo img { height: 48px; width: auto; }
.top nav { display: flex; gap: 22px; margin-inline-start: auto; }
.top nav a { color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500; }
.top nav a:hover { color: var(--ink); }
.top__actions { display: flex; gap: 10px; align-items: center; }
.lang { font: 600 14px/1 var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: var(--r-full); padding: 9px 14px; cursor: pointer; }
.lang:hover { border-color: var(--sky); }
.top .btn { padding: 10px 16px; font-size: 14px; }
@media (max-width: 900px) { .top nav { display: none; } .top__actions { margin-inline-start: auto; } }
@media (max-width: 440px) { .top .btn { display: none; } }

/* Hero */
.hero { padding-block: 64px 80px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset-block-start: -260px; inset-inline-end: -220px; width: 760px; height: 760px; border-radius: 50%;
  background: repeating-radial-gradient(circle, transparent 0 22px, rgba(110,180,249,.07) 22px 26px); pointer-events: none; }
.hero__grid { display: grid; grid-template-columns: 1.02fr 1fr; gap: 48px; align-items: center; position: relative; }
.hero__copy { display: grid; gap: 22px; min-width: 0; }
.hero h1 { font-size: clamp(42px, 6.2vw, 76px); line-height: .98; }
html[lang="ar"] .hero h1 { line-height: 1.25; }
.hero h1 em { font-style: normal; color: var(--sky); }
.hero__lead { font-size: 18px; color: var(--muted); max-width: 34em; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.hero__facts { display: flex; flex-wrap: wrap; gap: 10px 26px; padding-top: 8px; color: var(--muted); font-size: 14px; }
.hero__facts span { display: inline-flex; gap: 8px; align-items: center; }
.hero__facts svg { width: 18px; height: 18px; color: var(--success); }

.hero__visual { position: relative; min-width: 0; }
/* 3D stages: the PNG render paints first, the canvas fades in over it once the model is ready (and the PNG stays if it never is) */
.stage3d { position: relative; overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 35%, #1D3566 0%, var(--navy) 55%, var(--navy-deep) 100%); }
.stage3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .4s; }
.stage3d__poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 7% 6%; transition: opacity .4s, visibility 0s .4s; }
.stage3d.is-3d canvas { opacity: 1; }
.stage3d.is-3d .stage3d__poster { opacity: 0; visibility: hidden; }
.hero__stage { aspect-ratio: 1 / 1; box-shadow: 0 0 40px rgba(110,180,249,.18); --shift3d: .22; }  /* the device sits high so the live feed card can overlap the bottom */
.hero__stage .stage3d__poster { padding: 3% 5% 46%; }
.hero__stage canvas { pointer-events: none; }
.feed { position: absolute; inset-inline-start: -28px; inset-block-end: -28px; width: min(320px, 84%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: 0 14px 40px rgba(5,12,30,.5); }
.feed__head { display: grid; gap: 6px; margin-bottom: 12px; }
.feed__course { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.feed__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(74,222,128,.22); flex: none; }
.feed__cap { font-size: 12px; line-height: 1.5; color: var(--muted); }
.feed__course b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.feed__count { font: 700 26px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.feed__count small { font-size: 13px; color: var(--muted); font-weight: 500; }
.feed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.feed li { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 7px 10px; border-radius: var(--r-md); background: var(--navy-deep); }
.feed li .t { margin-inline-start: auto; font-family: var(--f-mono); color: var(--muted); font-size: 12px; }
.pill-ok { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-full); background: var(--success-soft); color: var(--success); font-size: 11px; font-weight: 600; }
.feed li.new { animation: slideIn .5s ease-out; }
@keyframes slideIn { from { transform: translateY(-6px); background: var(--sky-soft); } to { transform: none; } }
@media (max-width: 900px) {
  .hero__grid { grid-template-columns: 1fr; }
  .feed { position: relative; inset: auto; width: auto; margin-top: -40px; margin-inline: 16px; }
  .hero__stage { aspect-ratio: 4 / 3; --shift3d: .04; }
  .hero__stage .stage3d__poster { padding: 6% 5% 14%; }
}

/* Why strip */
.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.why__item { padding: 22px; border-top: 2px solid var(--line); display: grid; gap: 8px; }
.why__item .before { color: var(--muted); font-size: 14px; text-decoration: line-through; text-decoration-color: rgba(169,186,219,.5); }
.why__item h3 { font-size: 19px; font-weight: 700; }
@media (max-width: 760px) { .why { grid-template-columns: 1fr; } }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.step { position: relative; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; min-width: 0; }
.step__n { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--sky); color: var(--sky); display: grid; place-items: center; font: 700 16px/1 var(--f-mono); }
.step h3 { font-size: 18px; font-weight: 700; }
.step p { color: var(--muted); font-size: 15px; }
.step__shot { display: block; aspect-ratio: 4 / 3; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 35%, #1D3566 0%, var(--navy-deep) 100%); }
.step__shot img { width: 100%; height: 100%; object-fit: cover; object-position: 49% 50%; }
.step__shot--fit img { object-fit: contain; padding: 8px; }
.step__chart { display: grid; place-content: center; justify-items: center; gap: 12px; }
.donut { position: relative; width: 56%; min-width: 96px; display: grid; place-items: center; }
.donut svg { width: 100%; height: auto; display: block; }
.donut b { position: absolute; font: 700 20px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.donut__legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.donut__legend > span { display: inline-flex; align-items: center; gap: 6px; }
.donut__legend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
@media (max-width: 980px) { .steps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

/* Sectors */
.sectors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.sector { text-align: start; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 14px; align-content: start; cursor: pointer; transition: border-color .15s, transform .15s; min-width: 0; }
.sector:hover { border-color: var(--sky); transform: translateY(-2px); }
.sector__icon { width: 48px; height: 48px; border-radius: var(--r-md); background: var(--sky-soft); color: var(--sky); display: grid; place-items: center; }
.sector__icon svg { width: 26px; height: 26px; }
.sector h3 { font-size: 20px; font-weight: 700; }
.sector ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; color: var(--muted); font-size: 15px; }
.sector li { display: flex; gap: 8px; align-items: flex-start; }
.sector li svg { width: 16px; height: 16px; color: var(--success); flex: none; margin-top: 5px; }
.sector__link { color: var(--sky); font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.sector__link svg { width: 16px; height: 16px; flex: none; }
html[dir="rtl"] .sector__link svg, html[dir="rtl"] .flip { transform: scaleX(-1); }
@media (max-width: 980px) { .sectors { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .sectors { grid-template-columns: 1fr; } }

/* Features */
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.feature { background: var(--navy); padding: 28px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.feature svg { width: 26px; height: 26px; color: var(--sky); }
.feature h3 { font-size: 18px; font-weight: 700; }
.feature p { color: var(--muted); font-size: 15px; }
@media (max-width: 900px) { .features { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .features { grid-template-columns: 1fr; } }

/* Device */
.viewer { display: grid; gap: 14px; margin-bottom: 40px; }
.viewer__stage { height: clamp(340px, 56vh, 560px); }
.viewer__stage canvas { cursor: grab; touch-action: pan-y; }
.viewer__stage canvas:active { cursor: grabbing; }
.viewer__hint { position: absolute; inset-block-start: 14px; inset-inline-start: 14px; font-size: 12px; color: var(--muted); background: rgba(14,27,56,.7); padding: 6px 10px; border-radius: var(--r-full); pointer-events: none; display: none; }
.is-3d .viewer__hint { display: block; }
.viewer__note { color: var(--muted); font-size: 13px; }
.v3-labels { position: absolute; inset: 0; pointer-events: none; }
.v3-lbl { position: absolute; left: 0; top: 0; direction: ltr; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity .2s; will-change: transform; }
.v3-lbl i { width: 10px; height: 10px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 4px rgba(110,180,249,.25); flex: none; }
.v3-lbl span { font: 600 12px/1.2 var(--f-body); background: rgba(14,27,56,.86); border: 1px solid var(--line); padding: 5px 9px; border-radius: var(--r-md); color: var(--ink); }
html[lang="ar"] .v3-lbl span { font-family: var(--f-ar); font-size: 13px; direction: rtl; }
.v3-lbl[data-off="1"] { opacity: 0; }
.v3-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.v3-bar[hidden] { display: none; }
.v3-bar.is-wait { visibility: hidden; }
.v3-grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.v3-seg { display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 4px; background: var(--navy); border: 1px solid var(--line); border-radius: var(--r-full); }
.v3-seg button, .v3-tog { font: 600 13px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: var(--r-full); padding: 10px 14px; cursor: pointer; }
html[lang="ar"] .v3-seg button, html[lang="ar"] .v3-tog { font-family: var(--f-ar); font-size: 14px; }
.v3-seg button[aria-pressed="true"] { background: var(--sky); color: var(--on-sky); }
.v3-tog { border: 1px solid var(--line); }
.v3-tog[aria-pressed="true"] { color: var(--ink); border-color: var(--sky); }
.v3-tog[hidden] { display: none; }
.device__parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 28px; list-style: none; padding: 0; margin: 0 0 32px; }
.device__parts li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.device__parts svg { width: 22px; height: 22px; color: var(--sky); margin-top: 2px; }
.device__parts b { display: block; font-weight: 600; }
.device__parts span { color: var(--muted); font-size: 15px; }
.leds { display: flex; flex-wrap: wrap; gap: 10px 28px; padding: 16px 20px; border-radius: var(--r-lg); background: var(--navy); border: 1px solid var(--line); }
.leds__title { flex-basis: 100%; font-size: 13px; color: var(--muted); font-weight: 600; }
.led { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.led i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
@media (max-width: 980px) { .device__parts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .device__parts { grid-template-columns: 1fr; } .viewer__hint { display: none !important; } .viewer__stage { height: 320px; } }

/* Plans */
.tabs { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--navy-deep); border: 1px solid var(--line); border-radius: var(--r-full); margin-bottom: 32px; max-width: 100%; }
.tab { font: 600 14px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: var(--r-full); padding: 11px 18px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
html[lang="ar"] .tab { font-family: var(--f-ar); font-size: 15px; }
.tab svg { width: 18px; height: 18px; }
.tab[aria-selected="true"] { background: var(--sky); color: var(--on-sky); }
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
.plan { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; position: relative; }
.plan--pop { border-color: var(--sky); box-shadow: 0 0 0 1px var(--sky), 0 0 36px rgba(110,180,249,.16); }
.plan__tag { position: absolute; inset-block-start: -12px; inset-inline-start: 24px; background: var(--sky); color: var(--on-sky); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--r-full); }
.plan h3 { font-size: 22px; font-weight: 700; }
.plan__for { color: var(--muted); font-size: 15px; margin-top: 4px; }
.plan__price { display: grid; gap: 2px; padding-block: 14px; border-block: 1px solid var(--line); }
.plan__price b { font: 700 26px/1.2 var(--f-display); }
html[lang="ar"] .plan__price b { font-family: var(--f-ar); }
.plan__price span { color: var(--muted); font-size: 13px; }
.plan__specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spec { background: var(--navy-deep); border-radius: var(--r-md); padding: 10px 12px; }
.spec b { display: block; font: 700 20px/1.2 var(--f-body); font-variant-numeric: tabular-nums; }
.spec span { color: var(--muted); font-size: 12px; }
.plan ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 15px; flex: 1; }
.plan li { display: flex; gap: 10px; align-items: flex-start; }
.plan li svg { width: 18px; height: 18px; color: var(--success); flex: none; margin-top: 3px; }
.plan .btn { width: 100%; }
.plans__note { margin-top: 20px; color: var(--muted); font-size: 14px; }
@media (max-width: 980px) { .plans { grid-template-columns: 1fr; max-width: 520px; } }

/* Transformation */
.dt { display: grid; grid-template-columns: 1fr 1.2fr; gap: 48px; align-items: center; }
.dt__mark { font: 800 clamp(96px, 16vw, 180px)/.85 var(--f-display); color: transparent; -webkit-text-stroke: 2px var(--sky); letter-spacing: -0.04em; }
.dt__mark + p { margin-top: 12px; color: var(--muted); }
.dt__list { display: grid; gap: 18px; list-style: none; padding: 0; margin: 0; }
.dt__list li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.dt__list .ic { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--sky-soft); color: var(--sky); display: grid; place-items: center; }
.dt__list .ic svg { width: 22px; height: 22px; }
.dt__list h3 { font-size: 18px; font-weight: 700; }
.dt__list p { color: var(--muted); font-size: 15px; }
@media (max-width: 860px) { .dt { grid-template-columns: 1fr; gap: 28px; } }

/* FAQ */
.faq { display: grid; gap: 10px; max-width: 820px; }
.faq details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 22px; }
.faq summary { cursor: pointer; list-style: none; padding: 18px 0; font-weight: 600; font-size: 17px; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--sky); font: 600 22px/1 var(--f-mono); }
.faq details[open] summary::after { content: "–"; }
.faq details p { color: var(--muted); padding-bottom: 18px; }

/* Contact */
.contact { display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: start; }
.contact__info { display: grid; gap: 18px; }
.contact__row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); flex-wrap: wrap; }
.contact__row svg { width: 20px; height: 20px; color: var(--sky); flex: none; }
.contact__row .v { font-family: var(--f-mono); font-size: 15px; direction: ltr; user-select: all; }
.contact__row .l { color: var(--muted); font-size: 13px; flex-basis: 100%; margin-top: -6px; padding-inline-start: 32px; }
.copy { margin-inline-start: auto; font: 600 12px/1 var(--f-body); color: var(--sky); background: transparent; border: 1px solid var(--line); border-radius: var(--r-full); padding: 7px 12px; cursor: pointer; }
.form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.field { display: grid; gap: 6px; min-width: 0; }
.field--full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--navy-deep); border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 12px; width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--sky); outline: none; box-shadow: 0 0 0 3px var(--sky-soft); }
.form__err { grid-column: 1 / -1; color: #F87171; font-size: 14px; }
.form__done { grid-column: 1 / -1; display: grid; gap: 10px; padding: 16px; border-radius: var(--r-md); background: var(--navy-deep); border: 1px solid var(--success); }
.form__done[hidden] { display: none; }
.form__done p { font-size: 15px; }
.form .btn { grid-column: 1 / -1; }
@media (max-width: 860px) { .contact { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; padding: 20px; } }

/* Footer */
.foot { border-top: 1px solid var(--line); padding-block: 32px; color: var(--muted); font-size: 14px; }
.foot__in { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; }
.foot img { height: 40px; width: auto; }
@media (max-width: 760px) { .foot__in { flex-direction: column; align-items: flex-start; gap: 14px; } }

/* Floating WhatsApp button: a direct chat for questions that do not fit the quote form */
.wa-fab { position: fixed; z-index: 30; inset-inline-end: max(20px, env(safe-area-inset-right, 0px)); inset-block-end: calc(20px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #25D366; color: #fff; box-shadow: 0 10px 28px rgba(5,12,30,.5); transition: transform .15s; }
.wa-fab:hover { transform: translateY(-2px); }
.wa-fab svg { width: 30px; height: 30px; }
.foot { padding-bottom: 96px; }

/* Phone refinements */
.lang, .copy { min-height: 40px; }
.copy { padding-inline: 14px; }
@media (max-width: 560px) {
  .section { padding-block: 56px; }
  .sec-head { margin-bottom: 28px; }
  .hero { padding-block: 32px 56px; }
  .hero__grid { gap: 36px; }
  .hero__lead { font-size: 17px; }
  .hero__ctas .btn { flex: 1 1 100%; }
  .hero__facts { gap: 8px 20px; }
  .why__item { padding: 18px 0; }
  .step, .sector, .plan { padding: 20px; }
  .feature { padding: 22px 20px; }
  /* sector tabs: an even 2 x 2 grid instead of a pill that wraps unevenly */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; width: 100%; border-radius: var(--r-lg); margin-bottom: 24px; }
  .tab { justify-content: center; border-radius: var(--r-md); padding: 13px 8px; }
  /* 3D viewer controls: full-width rows with equal buttons */
  .v3-bar, .v3-grp { display: grid; gap: 8px; }
  .v3-bar { grid-template-columns: 1fr; }
  .v3-grp { grid-template-columns: 1fr 1fr; }
  .v3-grp .v3-seg { grid-column: 1 / -1; }
  .v3-seg { display: flex; flex-wrap: nowrap; }
  .v3-seg button { flex: 1; padding-inline: 6px; }
  .v3-tog { padding-block: 12px; }
  .leds { gap: 10px 20px; padding: 16px; }
  .led { flex-basis: 100%; }
  .dt__mark { font-size: 88px; }
  .contact { gap: 28px; }
  .faq details { padding: 0 18px; }
  .faq summary { font-size: 16px; padding: 16px 0; }
}

/* Live feed */
let feedRows = [];
let count = 104;
const FEED_TOTAL = 107;   // students in the demo lecture
function stamp(minAgo) { const d = new Date(Date.now() - minAgo * 60000); return d.toLocaleTimeString(lang === "ar" ? "ar-EG" : "en-US", { hour: "numeric", minute: "2-digit" }); }
function renderFeed(animateFirst) {
  document.getElementById("feed").innerHTML = feedRows.slice(0, 3).map((r, i) => `<li class="${animateFirst && i === 0 ? "new" : ""}"><span class="pill-ok">${I.check.replace('aria-hidden="true"', 'aria-hidden="true" width="11" height="11"')}${esc(t("present"))}</span><span>${esc(L(FEED[r.i]))}</span><span class="t">${esc(r.time)}</span></li>`).join("");
  const fmt = new Intl.NumberFormat(lang === "ar" ? "ar-EG" : "en-US");
  document.getElementById("count").textContent = fmt.format(count);
  document.getElementById("countOf").textContent = lang === "ar" ? "من " + fmt.format(FEED_TOTAL) + " حاضر" : "of " + FEED_TOTAL + " present";
}
feedRows = [{ i: 0, time: stamp(0) }, { i: 1, time: stamp(1) }, { i: 2, time: stamp(1) }];
let next = 3;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) setInterval(() => {
  if (count >= FEED_TOTAL) { count = 101; }
  count++;
  feedRows.unshift({ i: next % FEED.length, time: stamp(0) }); next++;
  feedRows = feedRows.slice(0, 3);
  renderFeed(true);
}, 3200);

/* ===== 3D device (assets/device-3d.js) =====
   The PNG renders paint first. three.js, the mesh and the scene are fetched only when a stage is near the viewport,
   and the PNGs stay as the fallback if WebGL or the CDN is not available. */
const AX3D = { hero: null, viewer: null };
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
let libs3D = null;
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Could not load " + src)); document.head.appendChild(s); }); }
function load3D() { return libs3D || (libs3D = Promise.all([loadScript(THREE_URL), loadScript("assets/device-mesh.js")]).then(() => loadScript("assets/device-3d.js"))); }
function hasWebGL() {
  try { const gl = document.createElement("canvas").getContext("webgl"); if (!gl) return false; const lose = gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext(); return true; } catch (e) { return false; }
}
function whenNear(el, margin, fn) {
  if (!("IntersectionObserver" in window)) { fn(); return; }
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); fn(); } }, { rootMargin: margin });
  io.observe(el);
}
function init3D() {
  const heroStage = document.getElementById("heroStage"), devStage = document.getElementById("devStage"), bar = document.getElementById("devBar");
  const devFallback = () => {
    if (AX3D.viewer) { AX3D.viewer.destroy(); AX3D.viewer = null; }
    devStage.classList.remove("is-3d"); bar.hidden = true;
    const img = devStage.querySelector("img"); img.src = img.dataset.fallback; img.dataset.tAlt = "dev_alt_in"; img.alt = t("dev_alt_in");
  };
  const heroFallback = () => { if (AX3D.hero) { AX3D.hero.destroy(); AX3D.hero = null; } heroStage.classList.remove("is-3d"); };
  if (!hasWebGL()) { devFallback(); return; }
  whenNear(heroStage, "200px", () => load3D().then(() => {
    AX3D.hero = AXDevice.create(heroStage, { t, ariaKey: "hero_alt", onReady: () => heroStage.classList.add("is-3d"), onLost: heroFallback });
  }).catch(heroFallback));
  whenNear(devStage, "600px", () => load3D().then(() => {
    AX3D.viewer = AXDevice.create(devStage, {
      interactive: true, labelsEl: document.getElementById("devLabels"), t, ariaKey: "dev_alt", onLost: devFallback,
      onReady: () => { devStage.classList.add("is-3d"); bar.classList.remove("is-wait"); },
      onView: name => bar.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)))
    });
    // on a phone the labels crowd the model, so they start off there (the Labels button turns them on)
    if (window.matchMedia("(max-width: 560px)").matches) { AX3D.viewer.setLabels(false); bar.querySelector('[data-tog="labels"]').setAttribute("aria-pressed", "false"); }
  }).catch(devFallback));
  bar.querySelector('[data-tog="rotate"]').hidden = reduce;
  bar.addEventListener("click", (e) => {
    const b = e.target.closest("button"), v = AX3D.viewer; if (!b || !v) return;
    if (b.dataset.mode) { v.setMode(b.dataset.mode); bar.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
    else if (b.dataset.view) v.setView(b.dataset.view);
    else if (b.dataset.tog) { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); if (b.dataset.tog === "labels") v.setLabels(on); else v.setAutoRotate(on); }
  });
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { sector = go.dataset.go; renderTabs(); renderPlans(); document.getElementById("f-sector").value = sector; document.getElementById("plans").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); return; }
  const tab = e.target.closest("[data-sector]");
  if (tab) { sector = tab.dataset.sector; renderTabs(); renderPlans(); document.getElementById("f-sector").value = sector; document.getElementById("tab-" + sector).focus(); return; }
  const plan = e.target.closest("[data-plan]");
  if (plan) { const m = document.getElementById("f-msg"); m.value = (lang === "ar" ? "مهتم بباقة: " : "Interested in the plan: ") + plan.dataset.plan; document.getElementById("f-sector").value = sector; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const el = document.getElementById(cp.dataset.copy);
    const done = () => { cp.textContent = t("copied"); setTimeout(() => cp.textContent = t("copy"), 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(el.textContent).then(done, fallback); } catch (err) { fallback(); }
  }
});
document.getElementById("tabs").addEventListener("keydown", (e) => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const ids = SECTORS.map(s => s.id); let i = ids.indexOf(sector);
  const fwd = (e.key === "ArrowRight") !== (lang === "ar");
  sector = ids[(i + (fwd ? 1 : -1) + ids.length) % ids.length];
  renderTabs(); renderPlans(); document.getElementById("tab-" + sector).focus();
});
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target, err = document.getElementById("formErr");
  const v = id => document.getElementById(id).value.trim();
  const name = v('f-name'), org = v('f-org'), phone = v('f-phone');
  if (!name || !org || !phone) { err.textContent = t("f_err"); err.hidden = false; document.getElementById("formDone").hidden = true; return; }
  err.hidden = true;
  const sec = L(SECTORS.find(s => s.id === v("f-sector")).name);
  const lines = lang === "ar"
    ? ["طلب عرض سعر أتند إكس", "الاسم: " + name, "المؤسسة: " + org, "القطاع: " + sec, "العدد: " + (v("f-size") || "-"), "الموبايل: " + phone, v("f-msg")]
    : ["Attend-X quote request", "Name: " + name, "Institution: " + org, "Sector: " + sec, "Size: " + (v("f-size") || "-"), "Phone: " + phone, v("f-msg")];
  const url = "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(lines.filter(Boolean).join("\n"));
  document.getElementById("waLink").href = url;
  // one click: the button opens WhatsApp itself. The "Open WhatsApp" box only appears if the browser blocked the new tab.
  const win = window.open(url, "_blank");
  if (win) win.opener = null;
  document.getElementById("formDone").hidden = !!win;
});

/* Language: #en or #ar in the link wins, then the visitor's saved choice, then Arabic */
(function init() {
  const h = location.hash.replace("#", "");
  let saved = null; try { saved = localStorage.getItem("ax-lang"); } catch (e) {}
  if (h === "en" || h === "ar") lang = h; else if (saved === "en" || saved === "ar") lang = saved;
  renderAll();
  init3D();
})();
</script>
